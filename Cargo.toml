[package]
name = "macos_screenshot"
version = "0.1.0"
edition = "2024"
default-run = "macos_screenshot"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
global-hotkey = "0.8.0"
image = "0.25.10"
imageproc = { version = "0.27.0", default-features = false }
muda = "0.21.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tray-icon = "0.26.0"
xcap = "0.9.8"
